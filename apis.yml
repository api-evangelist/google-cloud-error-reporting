aid: google-cloud-error-reporting
name: Google Cloud Error Reporting
description: >-
  Google Cloud Error Reporting groups and counts similar errors from cloud services and applications, reports new
  errors, and provides access to error groups and statistics. It automatically analyzes exceptions and displays them in
  a centralized interface with alerting, helping developers quickly identify and fix reliability issues in production.
