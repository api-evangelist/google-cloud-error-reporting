apis:
  - name: Google Cloud Error Reporting API
    description: >-
      The Error Reporting API enables listing error events, retrieving error group statistics, reporting new errors, and
      managing error groups. It groups and counts similar errors from cloud services and applications and provides
      programmatic access to error data and statistics.
