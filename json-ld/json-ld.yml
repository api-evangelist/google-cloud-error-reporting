"@context":
  "@vocab": https://schema.org/
  gcloud: https://cloud.google.com/error-reporting/reference/rest/v1beta1/
  name: schema:name
  description: schema:description
  url: schema:url
  ErrorEvent:
    "@id": gcloud:projects.events
    "@type": schema:Action
    eventTime: schema:startTime
    serviceContext: schema:agent
    message: schema:description
    context: schema:object
  ErrorGroup:
    "@id": gcloud:projects.groups
    "@type": schema:ItemList
    groupId: schema:identifier
    trackingIssues: schema:relatedLink
    resolutionStatus: schema:actionStatus
  ErrorGroupStats:
    "@id": gcloud:projects.groupStats
    "@type": schema:Dataset
    group: schema:about
    count: schema:numberOfItems
    affectedUsersCount: schema:userInteractionCount
    firstSeenTime: schema:startTime
    lastSeenTime: schema:endTime
    affectedServices: schema:provider
  ServiceContext:
    "@id": gcloud:ServiceContext
    "@type": schema:SoftwareApplication
    service: schema:name
    version: schema:softwareVersion
    resourceType: schema:applicationCategory
