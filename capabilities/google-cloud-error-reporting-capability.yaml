naftiko: 1.0.0-alpha2
info:
  label: Google Cloud Error Reporting API
  description: The Error Reporting API enables listing error events, retrieving error group statistics, reporting new errors,
    and managing error groups. It groups and counts similar errors from cloud services and applications and provides programmatic
    access to error data and statistics.
  tags:
  - Google
  - Cloud
  - Error
  - Reporting
  - API
  created: '2026-05-06'
  modified: '2026-05-06'
capability:
  consumes:
  - type: http
    namespace: google-cloud-error-reporting
    baseUri: https://clouderrorreporting.googleapis.com
    description: Google Cloud Error Reporting API HTTP API.
    resources:
    - name: v1beta1-projects-projectid-events
      path: /v1beta1/projects/{projectId}/events
      operations:
      - name: listevents
        method: GET
        description: Google Cloud Error Reporting List Error Events
        inputParameters:
        - name: projectId
          in: path
          type: string
          required: true
        - name: groupId
          in: query
          type: string
          required: true
          description: The group for which events are returned.
        - name: pageSize
          in: query
          type: integer
        - name: pageToken
          in: query
          type: string
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: v1beta1-projects-projectid-events-report
      path: /v1beta1/projects/{projectId}/events:report
      operations:
      - name: reportevent
        method: POST
        description: Google Cloud Error Reporting Report Error Event
        inputParameters:
        - name: projectId
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: v1beta1-projects-projectid-groupstats
      path: /v1beta1/projects/{projectId}/groupStats
      operations:
      - name: listgroupstats
        method: GET
        description: Google Cloud Error Reporting List Group Stats
        inputParameters:
        - name: projectId
          in: path
          type: string
          required: true
        - name: timeRange.period
          in: query
          type: string
        - name: pageSize
          in: query
          type: integer
        - name: pageToken
          in: query
          type: string
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: v1beta1-projects-projectid-groups-groupid
      path: /v1beta1/projects/{projectId}/groups/{groupId}
      operations:
      - name: getgroup
        method: GET
        description: Google Cloud Error Reporting Get Error Group
        inputParameters:
        - name: projectId
          in: path
          type: string
          required: true
        - name: groupId
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updategroup
        method: PUT
        description: Google Cloud Error Reporting Update Error Group
        inputParameters:
        - name: projectId
          in: path
          type: string
          required: true
        - name: groupId
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: v1beta1-projects-projectid-events-deleteall
      path: /v1beta1/projects/{projectId}/events:deleteAll
      operations:
      - name: deleteevents
        method: DELETE
        description: Google Cloud Error Reporting Delete All Events
        inputParameters:
        - name: projectId
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: google-cloud-error-reporting-rest
    description: REST adapter for Google Cloud Error Reporting API.
    resources:
    - path: /v1beta1/projects/{projectId}/events
      name: listevents
      operations:
      - method: GET
        name: listevents
        description: Google Cloud Error Reporting List Error Events
        call: google-cloud-error-reporting.listevents
        with:
          projectId: rest.projectId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1beta1/projects/{projectId}/events:report
      name: reportevent
      operations:
      - method: POST
        name: reportevent
        description: Google Cloud Error Reporting Report Error Event
        call: google-cloud-error-reporting.reportevent
        with:
          projectId: rest.projectId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1beta1/projects/{projectId}/groupStats
      name: listgroupstats
      operations:
      - method: GET
        name: listgroupstats
        description: Google Cloud Error Reporting List Group Stats
        call: google-cloud-error-reporting.listgroupstats
        with:
          projectId: rest.projectId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1beta1/projects/{projectId}/groups/{groupId}
      name: getgroup
      operations:
      - method: GET
        name: getgroup
        description: Google Cloud Error Reporting Get Error Group
        call: google-cloud-error-reporting.getgroup
        with:
          projectId: rest.projectId
          groupId: rest.groupId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1beta1/projects/{projectId}/groups/{groupId}
      name: updategroup
      operations:
      - method: PUT
        name: updategroup
        description: Google Cloud Error Reporting Update Error Group
        call: google-cloud-error-reporting.updategroup
        with:
          projectId: rest.projectId
          groupId: rest.groupId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1beta1/projects/{projectId}/events:deleteAll
      name: deleteevents
      operations:
      - method: DELETE
        name: deleteevents
        description: Google Cloud Error Reporting Delete All Events
        call: google-cloud-error-reporting.deleteevents
        with:
          projectId: rest.projectId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: google-cloud-error-reporting-mcp
    transport: http
    description: MCP adapter for Google Cloud Error Reporting API for AI agent use.
